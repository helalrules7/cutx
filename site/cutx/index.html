<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CutX — Cut and paste files in Finder</title>
<meta name="description" content="Press ⌘X on a file or folder in Finder, then ⌘V where you want it. The items move, exactly like Windows. Free and open source for macOS.">
<link rel="icon" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta property="og:title" content="CutX — Cut and paste files in Finder">
<meta property="og:description" content="Press ⌘X, then ⌘V. Your files move — just like on Windows. Free and open source for macOS.">
<meta property="og:image" content="https://ahmedhelal.dev/cutx/assets/icon.png">
<meta property="og:url" content="https://ahmedhelal.dev/cutx/">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{
  --bg:#0b1020; --bg2:#111a33; --card:rgba(255,255,255,.05); --line:rgba(255,255,255,.12);
  --fg:#eef2ff; --muted:#a8b3d1; --accent:#4d8dff; --accent2:#2554d8;
  --radius:18px; --max:1080px;
}
@media (prefers-color-scheme:light){
  :root{ --bg:#f6f8fd; --bg2:#eaf0fb; --card:rgba(11,16,32,.04); --line:rgba(11,16,32,.10);
         --fg:#0b1020; --muted:#4c5878; }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:16px/1.7 "Changa",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,
       "Noto Sans JP","Noto Sans SC",Arial,sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}

/* Two slow-drifting colour fields behind everything. They are the whole reason
   the page feels alive rather than flat, and they cost one element each. */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora span{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
.aurora span:nth-child(1){width:56vw;height:56vw;left:-14vw;top:-18vw;
  background:radial-gradient(circle,#4d8dff,transparent 68%);animation:drift1 26s ease-in-out infinite}
.aurora span:nth-child(2){width:48vw;height:48vw;right:-12vw;top:8vw;
  background:radial-gradient(circle,#8b5cf6,transparent 68%);animation:drift2 32s ease-in-out infinite}
.aurora span:nth-child(3){width:44vw;height:44vw;left:24vw;top:62vw;
  background:radial-gradient(circle,#06b6d4,transparent 68%);animation:drift1 38s ease-in-out infinite reverse}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(7vw,5vw) scale(1.14)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-6vw,7vw) scale(1.1)}}
@media (prefers-color-scheme:light){.aurora span{opacity:.30}}
main,header,footer{position:relative;z-index:1}

/* Reveal on scroll. Everything starts visible if JS never runs. */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .aurora span{animation:none}
  .reveal{opacity:1;transform:none;transition:none}
  .demo *{animation:none !important}
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}

/* top bar */
header{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);
  background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:62px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;color:var(--fg)}
.brand img{width:28px;height:28px;border-radius:7px}
.spacer{flex:1}
select{
  appearance:none;background:var(--card);color:var(--fg);border:1px solid var(--line);
  border-radius:10px;padding:7px 30px 7px 12px;font:inherit;font-size:14px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
                   linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 15px,calc(100% - 11px) 15px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
html[dir=rtl] select{padding:7px 12px 7px 30px;background-position:16px 15px,11px 15px}

/* hero */
.hero{position:relative;overflow:hidden;padding:76px 0 64px;text-align:center}
.hero::before{content:"";position:absolute;inset:-40% -20% auto;height:620px;
  background:radial-gradient(60% 60% at 50% 0%,rgba(77,141,255,.30),transparent 70%);pointer-events:none}
.hero img.icon{width:112px;height:112px;border-radius:26px;position:relative;
  box-shadow:0 24px 60px rgba(20,60,160,.38)}
h1{font-size:clamp(42px,6.6vw,68px);line-height:1.06;margin:24px 0 12px;letter-spacing:-.01em;font-weight:800;
  background:linear-gradient(180deg,var(--fg),color-mix(in srgb,var(--fg) 58%,var(--accent)));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--muted);font-size:clamp(17px,2.4vw,21px);margin:0 auto 26px;max-width:640px}
.lede{max-width:620px;margin:0 auto 32px;font-size:17px;color:var(--fg)}
.lede b{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:2px 8px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;font-weight:600}
.cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;gap:9px;padding:14px 26px;border-radius:13px;
  font-weight:620;font-size:16px;border:1px solid transparent;transition:transform .12s ease,box-shadow .12s ease}
.btn:hover{text-decoration:none;transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,#5b9bff,#2554d8 60%,#7c3aed);color:#fff;
  box-shadow:0 10px 34px rgba(37,84,216,.5),0 0 0 1px rgba(255,255,255,.14) inset;
  background-size:180% 180%;animation:sheen 7s ease infinite}
@keyframes sheen{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.btn.primary:hover{box-shadow:0 16px 44px rgba(37,84,216,.62),0 0 0 1px rgba(255,255,255,.2) inset}
.btn.ghost{background:var(--card);border-color:var(--line);color:var(--fg)}
.meta{color:var(--muted);font-size:14px}
.shot{margin:52px auto 0;max-width:860px;border-radius:14px;display:block;width:100%;
  box-shadow:0 30px 80px rgba(0,0,0,.42);border:1px solid var(--line)}


/* ---- Animated demo -------------------------------------------------------
   A hand-built Finder window that performs the whole gesture on a loop: three
   files are selected, ⌘X marks them, the window changes folder, ⌘V drops them
   in. Showing the thing working beats any sentence describing it, and it costs
   no video file. */
.demo{max-width:820px;margin:54px auto 0;border-radius:16px;overflow:hidden;
  border:1px solid var(--line);background:color-mix(in srgb,var(--bg2) 78%,transparent);
  box-shadow:0 34px 90px rgba(0,0,0,.5);backdrop-filter:blur(16px)}
.demo-bar{display:flex;align-items:center;gap:8px;padding:12px 16px;
  border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 55%,transparent)}
.dot{width:11px;height:11px;border-radius:50%}
.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
.demo-title{margin-inline-start:12px;font-size:13.5px;font-weight:600;color:var(--fg);
  transition:opacity .3s ease}
.demo-body{position:relative;padding:26px;min-height:210px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-content:start}
.file{display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:12px 6px;border-radius:10px;transition:background .3s ease,opacity .45s ease,transform .45s ease}
.file.sel{background:color-mix(in srgb,var(--accent) 26%,transparent)}
.file.gone{opacity:0;transform:scale(.85)}
.file.arrive{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.file svg{width:42px;height:52px}
.file span{font-size:12.5px;color:var(--muted);font-weight:500}
.file.sel span{color:#fff}
.keycap{position:absolute;inset-inline-end:24px;bottom:22px;display:flex;gap:7px;
  opacity:0;transition:opacity .25s ease}
.keycap.show{opacity:1}
.keycap b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:700;
  background:linear-gradient(180deg,#fff,#dfe6f5);color:#0b1020;border-radius:8px;
  padding:8px 13px;box-shadow:0 4px 0 rgba(0,0,0,.28),0 8px 22px rgba(0,0,0,.35)}
.hud{position:absolute;inset-inline-start:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
  background:rgba(20,26,44,.92);border:1px solid rgba(255,255,255,.16);color:#fff;
  padding:11px 20px;border-radius:12px;font-size:14.5px;font-weight:600;
  opacity:0;transition:opacity .3s ease,transform .3s ease;pointer-events:none;white-space:nowrap}
html[dir=rtl] .hud{transform:translate(50%,-50%) scale(.9)}
.hud.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
html[dir=rtl] .hud.show{transform:translate(50%,-50%) scale(1)}
.demo-caption{text-align:center;color:var(--muted);font-size:14px;margin-top:16px}

/* sections */
section{padding:70px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(26px,3.6vw,34px);margin:0 0 16px;letter-spacing:-.015em;font-weight:700}
.body{color:var(--muted);max-width:720px;font-size:16.5px}
.body i{color:var(--fg);font-style:normal;font-weight:600}
.note{margin-top:18px;padding:16px 20px;background:var(--card);border:1px solid var(--line);
  border-inline-start:3px solid var(--accent);
  border-radius:12px;font-size:15px;color:var(--fg);max-width:720px;backdrop-filter:blur(10px)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:34px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;
  backdrop-filter:blur(12px);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.card:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--accent) 46%,var(--line));
  box-shadow:0 18px 44px rgba(20,60,160,.24)}
.card h3{margin:0 0 7px;font-size:17px;font-weight:650}
.card p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.6}
ul.limits{margin:22px 0 0;padding:0;list-style:none;max-width:760px}
ul.limits li{position:relative;padding-inline-start:26px;margin-bottom:14px;color:var(--muted);font-size:15.5px}
ul.limits li::before{content:"—";position:absolute;inset-inline-start:0;color:var(--accent)}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:32px}
.gallery img{width:100%;border-radius:12px;border:1px solid var(--line);
  box-shadow:0 14px 34px rgba(0,0,0,.28)}
.langs{display:flex;flex-wrap:wrap;gap:9px;margin-top:26px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:8px 16px;font-size:14px;color:var(--fg);backdrop-filter:blur(10px);
  transition:transform .15s ease,border-color .15s ease;cursor:default}
.chip:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.support{text-align:center}
.support .btn{margin-top:22px}
footer{padding:44px 0 60px;border-top:1px solid var(--line);color:var(--muted);font-size:14.5px}
.frow{display:flex;gap:22px;flex-wrap:wrap;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="aurora"><span></span><span></span><span></span></div>

<header>
  <div class="wrap bar">
    <a class="brand" href="./"><img src="assets/icon.png" alt=""> CutX</a>
    <span class="spacer"></span>
    <select id="lang" aria-label="Language"></select>
  </div>
</header>

<div class="hero">
  <div class="wrap">
    <img class="icon" src="assets/icon.png" alt="CutX">
    <h1>CutX</h1>
    <p class="tag" data-i18n="tagline"></p>
    <p class="lede" data-i18n-html="lede"></p>
    <div class="cta">
      <a class="btn primary" href="https://github.com/helalrules7/cutx/releases/latest" data-i18n="download"></a>
      <a class="btn ghost" href="https://github.com/helalrules7/cutx" data-i18n="source"></a>
    </div>
    <p class="meta" data-i18n="free"></p>

    <div class="demo" id="demo" aria-label="Animation of files being cut and pasted">
      <div class="demo-bar">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        <span class="demo-title" id="demoFolder">Downloads</span>
      </div>
      <div class="demo-body" id="demoBody">
        <div class="file"><svg viewBox="0 0 40 50"><rect x="2" y="2" width="36" height="46" rx="5" fill="#fff" opacity=".92"/><rect x="8" y="12" width="20" height="2.5" rx="1.2" fill="#94a3b8"/><rect x="8" y="19" width="24" height="2.5" rx="1.2" fill="#cbd5e1"/><rect x="8" y="26" width="16" height="2.5" rx="1.2" fill="#cbd5e1"/></svg><span>Report.pdf</span></div>
        <div class="file"><svg viewBox="0 0 40 50"><path d="M3 12a4 4 0 014-4h9l4 4h13a4 4 0 014 4v22a4 4 0 01-4 4H7a4 4 0 01-4-4z" fill="#5aa9ff"/></svg><span>Screenshots</span></div>
        <div class="file"><svg viewBox="0 0 40 50"><rect x="2" y="2" width="36" height="46" rx="5" fill="#fff" opacity=".92"/><rect x="8" y="12" width="24" height="2.5" rx="1.2" fill="#22c55e"/><rect x="8" y="19" width="18" height="2.5" rx="1.2" fill="#bbf7d0"/><rect x="8" y="26" width="22" height="2.5" rx="1.2" fill="#bbf7d0"/></svg><span>invoice.xlsx</span></div>
      </div>
      <div class="keycap" id="keys"><b id="k1">⌘</b><b id="k2">X</b></div>
      <div class="hud" id="hud">✂︎ 3 items cut</div>
    </div>
    <p class="demo-caption" data-i18n="demoCaption"></p>

</div>

<section>

<section>

<section>
  <div class="wrap">

    <div class="grid">
      <div class="card"><h3 data-i18n="f1t"></h3><p data-i18n="f1b"></p></div>
      <div class="card"><h3 data-i18n="f2t"></h3><p data-i18n="f2b"></p></div>

<script src="i18n.js"></script>
<script>
const KEY = "cutx-lang";

function pick() {
  const saved = localStorage.getItem(KEY);
  if (saved && STRINGS[saved]) return saved;
  for (const pref of navigator.languages || [navigator.language]) {
    if (STRINGS[pref]) return pref;                       // exact, e.g. pt-BR
    const base = pref.split("-")[0];
    if (base === "zh") return "zh-Hans";
    if (base === "pt") return "pt-BR";
    if (STRINGS[base]) return base;
  }
  return "en";
}

function apply(code) {
  const t = STRINGS[code] || STRINGS.en;
  document.documentElement.lang = code;
  document.documentElement.dir = t._rtl ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const v = t[el.dataset.i18n];
    if (v) el.textContent = v;
  });
  document.querySelectorAll("[data-i18n-html]").forEach(el => {
    const v = t[el.dataset.i18nHtml];
    if (v) el.innerHTML = v;
  });
  window.__demoCut = t.demoCut || "✂︎ 3 items cut";
  localStorage.setItem(KEY, code);
  document.getElementById("lang").value = code;
}

const select = document.getElementById("lang");
for (const [code, t] of Object.entries(STRINGS)) {
  const option = document.createElement("option");
  option.value = code;
  option.textContent = t._name;
  select.appendChild(option);
}
select.addEventListener("change", e => apply(e.target.value));

// The chips list every language the app itself speaks — same set as this page.
const chips = document.getElementById("chips");
for (const t of Object.values(STRINGS)) {
  const span = document.createElement("span");
  span.className = "chip";
  span.textContent = t._name;
  chips.appendChild(span);
}

apply(pick());

// ---- The looping demo ----------------------------------------------------
// Deliberately written as an explicit timeline rather than CSS keyframes: the
// steps need to drive several unrelated elements in sequence, and a list of
// (delay, action) pairs is far easier to retime than staggered animations.
(function () {
  const body = document.getElementById("demoBody");
  const files = [...body.querySelectorAll(".file")];
  const folder = document.getElementById("demoFolder");
  const keys = document.getElementById("keys");
  const k2 = document.getElementById("k2");
  const hud = document.getElementById("hud");
  if (!body) return;

  const wait = ms => new Promise(r => setTimeout(r, ms));
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  async function run() {
    while (true) {
      files.forEach(f => f.classList.remove("sel", "gone", "arrive"));
      folder.textContent = "Downloads";
      folder.style.opacity = 1;
      await wait(1100);

      for (const f of files) { f.classList.add("sel"); await wait(160); }
      await wait(500);

      k2.textContent = "X";
      keys.classList.add("show");
      await wait(420);
      hud.textContent = (window.__demoCut || "✂︎ 3 items cut");
      hud.classList.add("show");
      keys.classList.remove("show");
      await wait(1200);

      hud.classList.remove("show");
      folder.style.opacity = 0;
      files.forEach(f => f.classList.add("gone"));
      await wait(520);
      folder.textContent = "Projects";
      folder.style.opacity = 1;
      await wait(700);

      k2.textContent = "V";
      keys.classList.add("show");
      await wait(420);
      keys.classList.remove("show");
      files.forEach((f, i) => {
        f.classList.remove("gone", "sel");
        f.style.animationDelay = (i * 90) + "ms";
        f.classList.add("arrive");
      });
      await wait(2400);
    }
  }

  if (!reduced) run();
})();

// ---- Reveal on scroll ----------------------------------------------------
document.querySelectorAll("section, .demo, .shot").forEach(el => el.classList.add("reveal"));
const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
}, { threshold: 0.12 });
document.querySelectorAll(".reveal").forEach(el => io.observe(el));
// Anything already on screen at load should not wait for a scroll.
requestAnimationFrame(() => {
  document.querySelectorAll(".reveal").forEach(el => {
    if (el.getBoundingClientRect().top < innerHeight) el.classList.add("in");
  });
});

</script>
</body>
</html>
